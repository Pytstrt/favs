<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#100006">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no">
<title>Teri Kalyani ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}body{min-height:100vh;min-height:100dvh;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:white;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(255,30,90,.25),transparent 38%),linear-gradient(135deg,#080004,#520012 50%,#100005)}#canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.glow{position:fixed;width:45vw;height:45vw;border-radius:50%;background:rgba(255,20,90,.09);filter:blur(80px);animation:glowMove 8s ease-in-out infinite alternate}@keyframes glowMove{from{transform:translate(-5vw,5vh) scale(1)}to{transform:translate(8vw,-5vh) scale(1.2)}}.container{position:relative;z-index:5;width:min(900px,95vw);padding:20px;text-align:center}.title{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800;text-shadow:0 0 15px rgba(255,50,100,.6),0 0 40px rgba(255,30,90,.25)}.subtitle{margin-top:6px;font-size:.85rem;opacity:.55}.lyricBox{margin-top:25px;min-height:260px;display:flex;align-items:center;justify-content:center;padding:25px 15px;border-radius:30px;background:rgba(35,0,14,.65);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);box-shadow:0 25px 80px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.08)}#lyrics{max-width:850px;font-size:clamp(1.25rem,4.5vw,2.35rem);line-height:1.6;font-weight:800;text-shadow:0 5px 25px black}.word{display:inline-block;margin-right:.25em;color:rgba(255,255,255,.22);transition:color .025s linear,text-shadow .025s linear,transform .025s linear}.word.sung{color:#fff;text-shadow:0 0 12px rgba(255,60,120,.9),0 0 30px rgba(255,30,90,.55)}.word.current{color:#ff6f9d;transform:scale(1.06);text-shadow:0 0 15px #ff2e63,0 0 35px rgba(255,30,90,.9)}.controls{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:10px}button{border:none;color:white;cursor:pointer;font:inherit}.play{padding:13px 26px;border-radius:50px;background:linear-gradient(135deg,#ff2e63,#ff0050);font-weight:700;box-shadow:0 8px 30px rgba(255,46,99,.4);transition:.2s}.play:hover{transform:translateY(-2px) scale(1.03)}.icon{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1)}.progress{margin-top:18px}input[type=range]{width:100%;accent-color:#ff2e63;cursor:pointer}.time{display:flex;justify-content:space-between;margin-top:5px;font-size:.75rem;opacity:.5}#status{min-height:20px;margin-top:10px;color:#ff9ab6;font-size:.8rem}@media(max-width:600px){.container{width:97vw;padding:12px}.lyricBox{min-height:270px;padding:20px 8px;border-radius:22px}#lyrics{font-size:1.3rem}.play{padding:12px 19px}}
</style></head>
<body><canvas id="canvas"></canvas><div class="glow"></div><div class="container"><div class="title">❤️ Teri Kalyani</div><div class="subtitle">Hindi Section • Word-by-Word Karaoke</div><div class="lyricBox"><div id="lyrics"></div></div><div class="controls"><button id="play" class="play">▶ Play Hindi Section</button><button id="restart" class="icon">↺</button><button id="mute" class="icon">🔊</button></div><div class="progress"><input id="seek" type="range" min="104" max="145" step="0.01" value="104"><div class="time"><span id="current">1:44</span><span>2:25</span></div></div><div id="status"></div></div><audio id="audio" src="song.mp3" preload="auto"></audio>
<script>
const START=104.00,END=152.00;
const lyrics=[
[[104.10,"Kya"],[104.41,"fitoor"],[104.85,"door"],[105.32,"raha"],[105.78,"kyon"],[106.24,"jaaye"],[106.85,"na"]],
[[108.23,"Ye"],[108.68,"kasoor"],[109.31,"noor"],[109.76,"ka"],[110.22,"tere"],[110.83,"hai"],[111.30,"saara"]],
[[112.67,"Kya"],[112.98,"hansi"],[113.58,"hai"],[114.12,"usi"],[114.50,"ki"],[114.98,"wajah"],[115.58,"se"],[115.87,"to"],[116.18,"fansi"],[116.65,"main"]],
[[116.80,"Hoon"],[117.26,"uljhi"],[117.66,"mil"],[118.18,"jaaye"],[118.63,"bas"],[119.10,"teri"],[119.40,"hi"],[119.71,"teri"],[120.02,"hi"],[120.48,"teri"],[120.78,"hi"],[121.50,"baahein"]],
[[122.60,"Jo"],[122.68,"main"],[122.98,"karwat"],[123.47,"loon"],[123.92,"bhi"],[124.38,"milo"],[124.68,"har"],[125.15,"dam"],[125.30,"tum"],[125.60,"hi"]],
[[126.52,"Ho"],[126.83,"itni"],[127.45,"nazdeeki"],[128.05,"bechaini"],[128.82,"ye"],[130.19,"berahmi"],[130.77,"hai"]],
[[131.81,"Ye"],[132.17,"rangat"],[132.73,"kaajal"],[133.35,"ki"],[133.65,"hai"],[133.95,"teri"],[134,"khaatir"],[136,"hi"]],
[[137.10,"To"],[137.40,"daakhil"],[137.70,"dil"],[137.80,"mein"],[138,"ho"],[138.60,"main"],[138.93,"gayi"],[140.27,"teri"],[140.85,"kalyani"]],
[[145.28,"Haan"],[145.30,"teri"],[145.50,"kalyani"],[148.75,"meri"],[149.80,"kalyani"]]
];
const audio=document.getElementById('audio'),play=document.getElementById('play'),restart=document.getElementById('restart'),mute=document.getElementById('mute'),lyricsBox=document.getElementById('lyrics'),seek=document.getElementById('seek'),current=document.getElementById('current'),status=document.getElementById('status');
let currentLine=-1, raf=0, lastTime=-1;
function formatTime(t){const m=Math.floor(t/60),s=Math.floor(t%60).toString().padStart(2,'0');return `${m}:${s}`}
function getLine(t){let line=-1;for(let i=0;i<lyrics.length;i++)if(t>=lyrics[i][0][0])line=i;return line}
const lineEls=[];
function buildLines(){
  const frag=document.createDocumentFragment();
  lyrics.forEach((line,li)=>{
    const div=document.createElement('div');
    div.className='line';
    div.style.display='none';
    const wordEls=[];
    line.forEach((item,wi)=>{
      const span=document.createElement('span');
      span.className='word';
      span.dataset.index=wi;
      span.textContent=item[1];
      div.appendChild(span);
      wordEls.push(span);
    });
    frag.appendChild(div);
    lineEls.push({div,words:wordEls});
  });
  lyricsBox.appendChild(frag);
}
buildLines();
function renderLine(index){
  lineEls.forEach((l,i)=>{
    l.div.style.display=(i===index)?'':'none';
    if(i!==index){l.words.forEach(w=>{w.classList.remove('sung','current')})}
  });
}
function sync(t){
  if(t<START||t>=END)return;
  if(Math.abs(t-lastTime)<0.008)return; lastTime=t;
  const line=getLine(t);
  if(line!==currentLine){currentLine=line;renderLine(line)}
  if(line>=0){
    const words=lineEls[line].words;
    let active=-1;
    for(let i=0;i<lyrics[line].length;i++){if(t>=lyrics[line][i][0])active=i;else break}
    words.forEach((w,i)=>{w.classList.toggle('sung',i<=active);w.classList.toggle('current',i===active)});
  }
  seek.value=t;current.textContent=formatTime(t);
}
function frame(){
  if(audio.currentTime>=END){
    audio.pause();
    audio.currentTime=END;
    sync(END-0.001);
    status.textContent='Section complete.';
    return;
  }
  sync(audio.currentTime);
  if(!audio.paused)raf=requestAnimationFrame(frame)
}
async function playHindi(){try{if(audio.currentTime<START||audio.currentTime>=END)audio.currentTime=START;await audio.play();status.textContent='';cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}catch(e){status.textContent='Press Play Hindi Section to start.'}}
play.onclick=()=>audio.paused?playHindi():audio.pause();
restart.onclick=()=>{audio.currentTime=START;currentLine=-1;lastTime=-1;renderLine(-1);sync(START);playHindi()};
mute.onclick=()=>{audio.muted=!audio.muted;mute.textContent=audio.muted?'🔇':'🔊'};
seek.oninput=()=>{audio.currentTime=Number(seek.value);sync(audio.currentTime)};
audio.addEventListener('play',()=>{play.textContent='❚❚ Pause';cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)});
audio.addEventListener('pause',()=>{play.textContent='▶ Play Hindi Section';cancelAnimationFrame(raf);sync(audio.currentTime)});
audio.addEventListener('ended',()=>{cancelAnimationFrame(raf)});
window.addEventListener('load',()=>{audio.currentTime=START;sync(START);status.textContent='Tap Play to start.'});
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W,H;function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);const hearts=Array.from({length:55},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,size:Math.random()*13+7,speed:Math.random()*1.3+.4,alpha:Math.random()*.5+.15,drift:(Math.random()-.5)*.3}));function drawHeart(x,y,size,alpha){ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;ctx.fillStyle='#ff3d72';ctx.beginPath();ctx.moveTo(0,size*.35);ctx.bezierCurveTo(-size,-size*.25,-size*.55,-size*.85,0,-size*.28);ctx.bezierCurveTo(size*.55,-size*.85,size,-size*.25,0,size*.35);ctx.fill();ctx.restore()}function animate(){ctx.clearRect(0,0,W,H);hearts.forEach(h=>{h.y+=h.speed;h.x+=h.drift;if(h.y>H+30){h.y=-30;h.x=Math.random()*W}drawHeart(h.x,h.y,h.size,h.alpha)});requestAnimationFrame(animate)}animate();
</script></body></html>
